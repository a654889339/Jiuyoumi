version: '3.8'

services:
  jiuyoumi-mysql:
    image: mysql:8.0
    container_name: jiuyoumi-mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: jiuyoumi_secret_2024
      MYSQL_DATABASE: jiuyoumi_db
      MYSQL_CHARSET: utf8mb4
    volumes:
      - jiuyoumi-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  jiuyoumi-backend:
    build: ./backend
    container_name: jiuyoumi-backend
    restart: unless-stopped
    ports:
      - "5102:5102"
    depends_on:
      - jiuyoumi-mysql
    environment:
      NODE_ENV: production
      PORT: 5102
      DB_HOST: jiuyoumi-mysql
      DB_PORT: 3306
      DB_NAME: jiuyoumi_db
      DB_USER: root
      DB_PASSWORD: jiuyoumi_secret_2024
      JWT_SECRET: ${JWT_SECRET:-jiuyoumi_jwt_secret_2024}
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: jiuyoumi-1256887166
      COS_REGION: ap-shanghai
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.qq.com}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-九尤米}

  jiuyoumi-frontend:
    build: ./frontend
    container_name: jiuyoumi-frontend
    restart: unless-stopped
    ports:
      - "5101:5101"
    depends_on:
      - jiuyoumi-backend

volumes:
  jiuyoumi-mysql-data:
